<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KnutsonFPS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #05070a;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    canvas {
      display: block;
    }
    #ui-root {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .panel {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #111827 0, #020617 60%);
      pointer-events: auto;
    }
    .card {
      background: rgba(15, 23, 42, 0.95);
      border-radius: 12px;
      padding: 20px;
      width: 320px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border: 1px solid rgba(148,163,184,0.3);
    }
    .card h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }
    .card p {
      margin: 4px 0 10px;
      font-size: 13px;
      color: #9ca3af;
    }
    .field {
      margin-bottom: 10px;
    }
    .field label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      color: #e5e7eb;
    }
    .field input {
      width: 100%;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid #4b5563;
      background: #020617;
      color: #e5e7eb;
      font-size: 13px;
      outline: none;
    }
    .field input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px rgba(56,189,248,0.4);
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      border: none;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      background: #0ea5e9;
      color: #0b1120;
      font-weight: 600;
      flex: 1;
    }
    button.secondary {
      background: #111827;
      color: #e5e7eb;
      border: 1px solid #4b5563;
    }
    button:active {
      transform: translateY(1px);
    }
    #game-hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
    }
    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      margin-left: -6px;
      margin-top: -6px;
      border-radius: 50%;
      border: 2px solid rgba(248,250,252,0.8);
      box-shadow: 0 0 8px rgba(248,250,252,0.6);
    }
    #top-left {
      position: absolute;
      left: 10px;
      top: 10px;
      font-size: 12px;
      color: #e5e7eb;
      pointer-events: auto;
    }
    #top-left button {
      padding: 4px 8px;
      font-size: 11px;
      margin-top: 4px;
      flex: none;
    }
    #top-right {
      position: absolute;
      right: 10px;
      top: 10px;
      font-size: 12px;
      text-align: right;
    }
    #killfeed {
      position: absolute;
      right: 10px;
      top: 40px;
      font-size: 11px;
      text-align: right;
      max-width: 200px;
    }
    #killfeed div {
      margin-bottom: 2px;
      color: #e5e7eb;
      text-shadow: 0 0 4px #000;
    }
    #bottom-left {
      position: absolute;
      left: 10px;
      bottom: 10px;
      font-size: 12px;
    }
    #bottom-right {
      position: absolute;
      right: 10px;
      bottom: 10px;
      font-size: 12px;
      text-align: right;
    }
    #hp-bar {
      width: 120px;
      height: 8px;
      border-radius: 999px;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.6);
      overflow: hidden;
      margin-top: 4px;
    }
    #hp-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #22c55e, #facc15, #ef4444);
      transform-origin: left center;
    }
    #lobby-code {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
    }
    #death-panel {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, rgba(127,29,29,0.7) 0, rgba(15,23,42,0.95) 55%);
      pointer-events: auto;
    }
    #death-card {
      background: rgba(15, 23, 42, 0.98);
      border-radius: 12px;
      padding: 18px;
      width: 260px;
      border: 1px solid rgba(248,113,113,0.6);
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    #death-card h2 {
      margin: 0 0 6px;
      font-size: 18px;
      color: #fecaca;
    }
    #death-card p {
      margin: 4px 0 10px;
      font-size: 12px;
      color: #e5e7eb;
    }
    #death-card button {
      width: 100%;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui-root">
    <!-- Lobby / main menu -->
    <div id="menu-panel" class="panel">
      <div class="card">
        <h1>KnutsonFPS</h1>
        <p>Multiplayer FPS prototype with lobbies.</p>
        <div class="field">
          <label for="name-input">Name</label>
          <input id="name-input" maxlength="16" placeholder="Knutson" />
        </div>
        <div class="field">
          <label for="code-input">Lobby code (optional)</label>
          <input id="code-input" maxlength="8" placeholder="ABCD" />
        </div>
        <div class="btn-row">
          <button id="quickplay-btn">Quick Play</button>
          <button id="joincode-btn" class="secondary">Join by Code</button>
        </div>
      </div>
    </div>

    <!-- In-game HUD -->
    <div id="game-hud">
      <div id="crosshair"></div>
      <div id="top-left">
        <div id="player-name-label"></div>
        <div id="lobby-code"></div>
        <button id="leave-btn" class="secondary">Leave Lobby</button>
      </div>
      <div id="top-right">
        <div id="ammo-label">Ammo: ∞</div>
      </div>
      <div id="killfeed"></div>
      <div id="bottom-left">
        <div>HP</div>
        <div id="hp-bar"><div id="hp-fill"></div></div>
      </div>
      <div id="bottom-right">
        <div id="status-label"></div>
      </div>
    </div>

    <!-- Death screen -->
    <div id="death-panel">
      <div id="death-card">
        <h2>You Died</h2>
        <p id="death-text">Eliminated.</p>
        <button id="respawn-btn">Respawn in Same Lobby</button>
        <button id="back-menu-btn" class="secondary">Back to Menu</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    // ---------- CONFIG ----------
    const BASE = "https://knutsonfps-backend.knutsonfps.deno.net";

    // ---------- DOM ----------
    const canvas = document.getElementById("game");
    const menuPanel = document.getElementById("menu-panel");
    const gameHud = document.getElementById("game-hud");
    const deathPanel = document.getElementById("death-panel");
    const nameInput = document.getElementById("name-input");
    const codeInput = document.getElementById("code-input");
    const quickBtn = document.getElementById("quickplay-btn");
    const joinBtn = document.getElementById("joincode-btn");
    const leaveBtn = document.getElementById("leave-btn");
    const respawnBtn = document.getElementById("respawn-btn");
    const backMenuBtn = document.getElementById("back-menu-btn");
    const playerNameLabel = document.getElementById("player-name-label");
    const lobbyCodeLabel = document.getElementById("lobby-code");
    const hpFill = document.getElementById("hp-fill");
    const statusLabel = document.getElementById("status-label");
    const killfeedDiv = document.getElementById("killfeed");
    const deathText = document.getElementById("death-text");

    // ---------- STATE ----------
    let playerId = localStorage.getItem("knutson_player_id") || ("p_" + Math.random().toString(36).slice(2));
    localStorage.setItem("knutson_player_id", playerId);

    let currentLobby = null;
    let playerName = "Player";
    let hp = 100;
    let isDead = false;

    let scene, camera, renderer;
    let playerObj; // local player container
    let localSoldier; // local visible model
    let yaw = 0;
    let pitch = 0;
    let keys = {};
    let lastUpdateTime = performance.now();
    let otherPlayers = new Map(); // id -> { obj, data }

    let pollingInterval = null;
    let feedInterval = null;

    // ---------- THREE SETUP ----------
    function initThree() {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05070a);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

      const ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);
      const dir = new THREE.DirectionalLight(0xffffff, 0.6);
      dir.position.set(5, 10, 2);
      scene.add(dir);

      // Floor
      const floorGeo = new THREE.PlaneGeometry(200, 200);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 1, metalness: 0 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0;
      scene.add(floor);

      // Simple walls / cover
      const boxGeo = new THREE.BoxGeometry(4, 3, 1);
      const boxMat = new THREE.MeshStandardMaterial({ color: 0x1f2937 });
      for (let i = 0; i < 6; i++) {
        const b = new THREE.Mesh(boxGeo, boxMat);
        b.position.set((Math.random() - 0.5) * 40, 1.5, (Math.random() - 0.5) * 40);
        scene.add(b);
      }

      // Player container
      playerObj = new THREE.Object3D();
      scene.add(playerObj);

      // Local soldier model (simple capsule-ish)
      const bodyGeo = new THREE.CapsuleGeometry(0.4, 1.0, 4, 8);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8 });
      localSoldier = new THREE.Mesh(bodyGeo, bodyMat);
      localSoldier.position.y = 1;
      // IMPORTANT: align model forward (-Z) by rotating once
      localSoldier.rotation.y = -Math.PI / 2;
      playerObj.add(localSoldier);

      // Simple gun as a box attached to camera
      const gunGeo = new THREE.BoxGeometry(0.4, 0.2, 0.8);
      const gunMat = new THREE.MeshStandardMaterial({ color: 0x9ca3af, metalness: 0.3, roughness: 0.4 });
      const gun = new THREE.Mesh(gunGeo, gunMat);
      gun.position.set(0.25, -0.15, -0.6); // in front of camera, pointing -Z
      camera.add(gun);
      scene.add(camera);

      camera.position.set(0, 1.6, 5);
      playerObj.position.set(0, 0, 0);

      window.addEventListener("resize", onResize);
      window.addEventListener("keydown", (e) => { keys[e.code] = true; });
      window.addEventListener("keyup", (e) => { keys[e.code] = false; });

      canvas.addEventListener("click", () => {
        if (document.pointerLockElement !== canvas) {
          canvas.requestPointerLock();
        }
      });

      document.addEventListener("pointerlockchange", () => {
        if (document.pointerLockElement === canvas) {
          document.addEventListener("mousemove", onMouseMove);
        } else {
          document.removeEventListener("mousemove", onMouseMove);
        }
      });

      window.addEventListener("mousedown", (e) => {
        if (e.button === 0 && !isDead && currentLobby) {
          shoot();
        }
      });

      animate();
    }

    function onResize() {
      if (!renderer || !camera) return;
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }

    function onMouseMove(e) {
      const sensitivity = 0.0025;
      yaw -= e.movementX * sensitivity;
      pitch -= e.movementY * sensitivity;
      const maxPitch = Math.PI / 2 - 0.1;
      pitch = Math.max(-maxPitch, Math.min(maxPitch, pitch));
    }

    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = (now - lastUpdateTime) / 1000;
      lastUpdateTime = now;

      updatePlayer(dt);
      renderer.render(scene, camera);
    }

    function updatePlayer(dt) {
      if (!playerObj || !camera) return;
      if (isDead) return;

      // Apply rotation from yaw/pitch
      playerObj.rotation.y = yaw;
      camera.rotation.set(pitch, yaw, 0);

      const speed = 8;
      let dir = new THREE.Vector3();
      if (keys["KeyW"]) dir.z -= 1;
      if (keys["KeyS"]) dir.z += 1;
      if (keys["KeyA"]) dir.x -= 1;
      if (keys["KeyD"]) dir.x += 1;
      if (dir.lengthSq() > 0) {
        dir.normalize();
        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
        const move = new THREE.Vector3();
        move.addScaledVector(forward, dir.z);
        move.addScaledVector(right, dir.x);
        move.normalize().multiplyScalar(speed * dt);
        playerObj.position.add(move);
      }

      // Camera follows player
      camera.position.copy(playerObj.position).add(new THREE.Vector3(0, 1.6, 0));
    }

    // ---------- NETWORK ----------
    async function api(path, body) {
      try {
        const res = await fetch(BASE + path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {})
        });
        return await res.json();
      } catch (e) {
        console.warn("API error", path, e);
        return null;
      }
    }

    async function findLobby() {
      const res = await api("/find_lobby", {});
      if (res && res.lobby) return res.lobby;
      return null;
    }

    async function updateState() {
      if (!currentLobby) return;
      const pos = playerObj.position;
      const res = await api("/update", {
        id: playerId,
        lobby: currentLobby,
        x: pos.x,
        y: pos.y,
        z: pos.z,
        name: playerName,
        hp
      });
      if (res && res.name) {
        playerName = res.name;
        playerNameLabel.textContent = playerName;
      }
    }

    async function pollState() {
      if (!currentLobby) return;
      const res = await api("/get_state", { lobby: currentLobby });
      if (!res || !Array.isArray(res)) return;

      const seen = new Set();
      for (const p of res) {
        if (p.id === playerId) {
          hp = p.hp;
          updateHpBar();
          continue;
        }
        seen.add(p.id);
        let entry = otherPlayers.get(p.id);
        if (!entry) {
          const geo = new THREE.CapsuleGeometry(0.4, 1.0, 4, 8);
          const mat = new THREE.MeshStandardMaterial({ color: 0xf97316 });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.y = 1;
          // align forward (-Z)
          mesh.rotation.y = -Math.PI / 2;
          const container = new THREE.Object3D();
          container.add(mesh);
          scene.add(container);
          entry = { obj: container, mesh, data: p };
          otherPlayers.set(p.id, entry);
        }
        entry.data = p;
        entry.obj.position.set(p.x, 0, p.z);
        // rotate container to face direction of travel if you want; for now keep simple
      }

      // remove missing
      for (const [id, entry] of otherPlayers) {
        if (!seen.has(id)) {
          scene.remove(entry.obj);
          otherPlayers.delete(id);
        }
      }
    }

    async function pollFeed() {
      if (!currentLobby) return;
      const res = await api("/feed", { lobby: currentLobby });
      if (!res || !Array.isArray(res)) return;
      killfeedDiv.innerHTML = "";
      for (const ev of res) {
        const div = document.createElement("div");
        div.textContent = `${ev.attacker} → ${ev.target}`;
        killfeedDiv.appendChild(div);
      }
    }

    async function shoot() {
      // Raycast from camera forward, find closest other player, send damage
      const rayOrigin = camera.position.clone();
      const rayDir = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation).normalize();
      let closestId = null;
      let closestDist = Infinity;

      for (const [id, entry] of otherPlayers) {
        const targetPos = entry.obj.position.clone().add(new THREE.Vector3(0, 1, 0));
        const toTarget = targetPos.clone().sub(rayOrigin);
        const proj = toTarget.dot(rayDir);
        if (proj < 0) continue;
        const closestPoint = rayOrigin.clone().add(rayDir.clone().multiplyScalar(proj));
        const dist = closestPoint.distanceTo(targetPos);
        if (dist < 1.0 && proj < 60 && proj < closestDist) {
          closestDist = proj;
          closestId = id;
        }
      }

      if (closestId) {
        await api("/damage", {
          attacker: playerId,
          target: closestId,
          amount: 34,
          lobby: currentLobby
        });
      }
    }

    function updateHpBar() {
      const clamped = Math.max(0, Math.min(100, hp));
      hpFill.style.transform = `scaleX(${clamped / 100})`;
      if (clamped <= 0 && !isDead) {
        onDeath();
      }
    }

    function onDeath() {
      isDead = true;
      deathText.textContent = "You were eliminated.";
      deathPanel.style.display = "flex";
      gameHud.style.pointerEvents = "none";
      statusLabel.textContent = "Dead";
    }

    function resetPlayerPosition() {
      playerObj.position.set(
        (Math.random() - 0.5) * 20,
        0,
        (Math.random() - 0.5) * 20
      );
      hp = 100;
      isDead = false;
      updateHpBar();
      statusLabel.textContent = "";
    }

    function startPolling() {
      stopPolling();
      pollingInterval = setInterval(() => {
        updateState();
        pollState();
      }, 150);
      feedInterval = setInterval(() => {
        pollFeed();
      }, 800);
    }

    function stopPolling() {
      if (pollingInterval) clearInterval(pollingInterval);
      if (feedInterval) clearInterval(feedInterval);
      pollingInterval = null;
      feedInterval = null;
    }

    // ---------- UI FLOW ----------
    async function enterLobby(lobbyCode) {
      currentLobby = lobbyCode;
      lobbyCodeLabel.textContent = "Lobby: " + lobbyCode;
      playerName = nameInput.value.trim() || "Player";
      playerNameLabel.textContent = playerName;
      resetPlayerPosition();
      menuPanel.style.display = "none";
      gameHud.style.display = "block";
      deathPanel.style.display = "none";
      gameHud.style.pointerEvents = "none";
      startPolling();
      await updateState();
    }

    quickBtn.addEventListener("click", async () => {
      quickBtn.disabled = true;
      joinBtn.disabled = true;
      statusLabel.textContent = "Finding lobby...";
      const lobby = await findLobby();
      if (!lobby) {
        statusLabel.textContent = "Failed to find lobby.";
        quickBtn.disabled = false;
        joinBtn.disabled = false;
        return;
      }
      await enterLobby(lobby);
      quickBtn.disabled = false;
      joinBtn.disabled = false;
    });

    joinBtn.addEventListener("click", async () => {
      const code = codeInput.value.trim().toUpperCase();
      if (!code) {
        statusLabel.textContent = "Enter a lobby code.";
        return;
      }
      await enterLobby(code);
    });

    leaveBtn.addEventListener("click", () => {
      stopPolling();
      currentLobby = null;
      gameHud.style.display = "none";
      deathPanel.style.display = "none";
      menuPanel.style.display = "flex";
      statusLabel.textContent = "";
    });

    respawnBtn.addEventListener("click", async () => {
      if (!currentLobby) return;
      deathPanel.style.display = "none";
      resetPlayerPosition();
      isDead = false;
      await updateState();
    });

    backMenuBtn.addEventListener("click", () => {
      leaveBtn.click();
    });

    // ---------- START ----------
    initThree();
    updateHpBar();
  </script>
</body>
</html>
