<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KnutsonFPS</title><style>html,body{margin:0;padding:0;overflow:hidden;background:#050608;font-family:sans-serif;touch-action:none}#game{width:100vw;height:100vh;display:block}#lobby{position:absolute;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:50}#lobby-panel{width:330px;padding:20px;background:#111;border-radius:10px;color:#fff;border:1px solid #00e676}#lobby-title{text-align:center;font-size:22px;margin-bottom:10px}.lobby-label{margin-top:10px;font-size:12px;color:#ccc;text-transform:uppercase}.lobby-input,#weapon-select{width:100%;padding:6px;margin-top:4px;background:#222;border:1px solid #333;color:#fff;border-radius:4px}#play-btn{margin-top:16px;width:100%;padding:10px;background:#00e676;border:none;border-radius:4px;font-weight:bold}.color-row{display:flex;gap:6px;margin-top:6px}.color-swatch{width:28px;height:28px;border-radius:4px;border:2px solid #333;cursor:pointer}.color-swatch.selected{border-color:#00e676}#killfeed{position:absolute;top:10px;right:10px;color:#fff;font-size:14px;z-index:20;text-align:right}.name-label{position:absolute;color:#fff;font-size:12px;pointer-events:none;transform:translate(-50%,-50%)}.joystick{position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1)}#joy-move{left:20px;bottom:20px}#stick-move{position:absolute;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.2);left:40px;top:40px}#shoot-btn,#jump-btn,#grenade-btn,#sprint-btn,#view-toggle{position:absolute;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}#shoot-btn{right:20px;bottom:20px}#jump-btn{right:120px;bottom:20px}#grenade-btn{right:20px;bottom:120px}#sprint-btn{left:20px;bottom:170px}#view-toggle{top:20px;left:20px;width:100px;height:40px;border-radius:6px}#hitmarker{position:absolute;top:50%;left:50%;width:40px;height:40px;opacity:0;transform:translate(-50%,-50%) scale(.5);transition:.12s}#hitmarker:before,#hitmarker:after{content:"";position:absolute;background:#fff}#hitmarker:before{width:2px;height:40px;left:19px;top:0}#hitmarker:after{height:2px;width:40px;top:19px;left:0}#health-bar,#stamina-bar{position:absolute;left:50%;transform:translateX(-50%);height:8px;border-radius:4px}#health-bar{bottom:10px;width:200px;background:#f44336}#stamina-bar{bottom:22px;width:200px;background:#00e676}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script></head><body><canvas id="game"></canvas><div id="lobby"><div id="lobby-panel"><div id="lobby-title">KnutsonFPS</div><div class="lobby-label">Name</div><input id="name-input" class="lobby-input" value="Player"><div class="lobby-label">Sensitivity</div><input id="sens-slider" type="range" min="0.5" max="2.0" step="0.1" value="1.0"><div id="sens-value">1.0</div><div class="lobby-label">AFK Timeout</div><input id="afk-slider" type="range" min="30" max="300" step="10" value="180"><div id="afk-value">180</div><div class="lobby-label">Weapon</div><select id="weapon-select"><option value="rifle">Rifle</option><option value="smg">SMG</option><option value="shotgun">Shotgun</option><option value="pistol">Pistol</option></select><div class="lobby-label">Color</div><div class="color-row"><div class="color-swatch" data-color="0xff5252" style="background:#ff5252"></div><div class="color-swatch selected" data-color="0x40c4ff" style="background:#40c4ff"></div><div class="color-swatch" data-color="0x69f0ae" style="background:#69f0ae"></div><div class="color-swatch" data-color="0xffeb3b" style="background:#ffeb3b"></div><div class="color-swatch" data-color="0xff80ab" style="background:#ff80ab"></div></div><button id="play-btn">PLAY</button></div></div><div id="killfeed"></div><div id="hitmarker"></div><div id="health-bar"></div><div id="stamina-bar"></div><div id="joy-move" class="joystick"><div id="stick-move"></div></div><div id="shoot-btn">SHOOT</div><div id="jump-btn">JUMP</div><div id="grenade-btn">Nade</div><div id="sprint-btn">SPRINT</div><div id="view-toggle">VIEW: 1ST</div><script>
const BASE="https://knutsonfps-backend.knutsonfps.deno.net",PLAYER_ID="p_"+Math.random().toString(36).slice(2);let playerName="Player",playerColor=0x40c4ff,lookSensitivity=1,selectedWeaponKey="rifle",localHp=100,isDead=false;const lobby=document.getElementById("lobby"),nameInput=document.getElementById("name-input"),sensSlider=document.getElementById("sens-slider"),sensValue=document.getElementById("sens-value"),afkSlider=document.getElementById("afk-slider"),afkValue=document.getElementById("afk-value"),weaponSelect=document.getElementById("weapon-select"),killfeedEl=document.getElementById("killfeed");sensSlider.oninput=()=>{lookSensitivity=parseFloat(sensSlider.value);sensValue.textContent=sensSlider.value};afkSlider.oninput=()=>{afkValue.textContent=afkSlider.value};document.querySelectorAll(".color-swatch").forEach(s=>{s.onclick=()=>{document.querySelectorAll(".color-swatch").forEach(x=>x.classList.remove("selected"));s.classList.add("selected");playerColor=parseInt(s.dataset.color);if(localSoldier)updateSoldierColor(localSoldier,playerColor)}});const canvas=document.getElementById("game"),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(innerWidth,innerHeight);const scene=new THREE.Scene();scene.background=new THREE.Color(0x101318);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1e3);scene.add(new THREE.AmbientLight(16777215,.6));const sun=new THREE.DirectionalLight(16777215,1.2);sun.position.set(10,20,10);scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshPhongMaterial({color:0x263238}));ground.rotation.x=-Math.PI/2;scene.add(ground);const walls=[];function addWall(x,z,w,h,r=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,3,h),new THREE.MeshPhongMaterial({color:0x37474f}));m.position.set(x,1.5,z);m.rotation.y=r;walls.push(m);scene.add(m)}addWall(0,-60,120,1);addWall(0,60,120,1);addWall(-60,0,1,120);addWall(60,0,1,120);addWall(0,0,10,1);addWall(20,10,12,1,Math.PI/4);addWall(-25,-15,8,1);function collides(px,pz){for(const w of walls){if(Math.abs(px-w.position.x)<w.geometry.parameters.width/2+.5&&Math.abs(pz-w.position.z)<w.geometry.parameters.depth/2+.5)return true}return false}const player=new THREE.Object3D();player.position.set(0,.5,0);scene.add(player);function createSoldier(c){const g=new THREE.Group(),m=new THREE.MeshPhongMaterial({color:c}),t=new THREE.Mesh(new THREE.BoxGeometry(.6,.9,.3),m);t.position.y=1;const h=new THREE.Mesh(new THREE.BoxGeometry(.35,.35,.35),m);h.position.y=1.55;const aL=new THREE.Mesh(new THREE.BoxGeometry(.18,.7,.18),m);aL.position.set(-.45,1,0);const aR=new THREE.Mesh(new THREE.BoxGeometry(.18,.7,.18),m);aR.position.set(.45,1,0);const lL=new THREE.Mesh(new THREE.BoxGeometry(.18,.7,.18),m);lL.position.set(-.2,.45,0);const lR=new THREE.Mesh(new THREE.BoxGeometry(.18,.7,.18),m);lR.position.set(.2,.45,0);g.add(t,h,aL,aR,lL,lR);g.userData={torso:t,head:h,armL:aL,armR:aR,legL:lL,legR:lR,animTime:0};return g}function updateSoldierColor(s,c){s.traverse(o=>{if(o.isMesh)o.material.color.setHex(c)})}function createWeaponMesh(t,c){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(.9,.18,.18),new THREE.MeshPhongMaterial({color:0x212121}));b.position.set(.45,0,0);const br=new THREE.Mesh(new THREE.BoxGeometry(.5,.08,.08),b.material);br.position.set(.95,0,0);const m=new THREE.Mesh(new THREE.BoxGeometry(.18,.25,.12),new THREE.MeshPhongMaterial({color:c}));m.position.set(.3,-.18,0);g.add(b,br,m);g.position.set(.35,0,.12);g.rotation.z=-.2;return g}function attachWeapon(s,k,c){const u=s.userData;if(u.weapon)u.armR.remove(u.weapon);const w=createWeaponMesh(k,c);u.armR.add(w);u.weapon=w}let localSoldier=createSoldier(playerColor);player.add(localSoldier);attachWeapon(localSoldier,selectedWeaponKey,playerColor);let yaw=0,pitch=0,velY=0,grounded=true,moveX=0,moveY=0;function updateMovement(dt){if(isDead)return;const sp=7,dx=(moveX*Math.cos(yaw))+(-moveY*Math.sin(yaw)),dz=(moveX*Math.sin(yaw))+(-moveY*Math.cos(yaw)),nx=player.position.x+dx*sp*dt,nz=player.position.z+dz*sp*dt;if(!collides(nx,player.position.z))player.position.x=nx;if(!collides(player.position.x,nz))player.position.z=nz;velY+=-20*dt;player.position.y+=velY*dt;if(player.position.y<.5){player.position.y=.5;velY=0;grounded=true}player.rotation.y=yaw;const d=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));camera.position.set(player.position.x,player.position.y+1.2,player.position.z);camera.lookAt(camera.position.x+d.x,camera.position.y+d.y,camera.position.z+d.z)}function animateSoldier(s,dt){const u=s.userData;u.animTime+=dt;const t=u.animTime;u.armL.rotation.x=Math.sin(t*6)*.4;u.armR.rotation.x=Math.sin(t*6+Math.PI)*.4;u.legL.rotation.x=Math.sin(t*6+Math.PI)*.6;u.legR.rotation.x=Math.sin(t*6)*.6}const joy=document.getElementById("joy-move"),stick=document.getElementById("stick-move");joy.addEventListener("touchmove",e=>{const t=e.touches[0],r=joy.getBoundingClientRect(),x=t.clientX-r.left-70,y=t.clientY-r.top-70,d=Math.hypot(x,y),m=50;if(d>m){x=x/d*m;y=y/d*m}stick.style.left=x+40+"px";stick.style.top=y+40+"px";moveX=x/m;moveY=y/m});joy.addEventListener("touchend",()=>{stick.style.left="40px";stick.style.top="40px";moveX=0;moveY=0});document.getElementById("shoot-btn").ontouchstart=()=>{const h=document.getElementById("hitmarker");h.style.opacity=1;h.style.transform="translate(-50%,-50%) scale(1)";setTimeout(()=>{h.style.opacity=0;h.style.transform="translate(-50%,-50%) scale(.5)"},120)};document.getElementById("jump-btn").ontouchstart=()=>{if(grounded){velY=8;grounded=false}};let third=false;document.getElementById("view-toggle").onclick=()=>{third=!third;document.getElementById("view-toggle").textContent="VIEW: "+(third?"3RD":"1ST");localSoldier.visible=third};const rem=new Map();async function sendUpdate(){if(isDead)return;await fetch(BASE+"/update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:PLAYER_ID,x:player.position.x,y:player.position.y,z:player.position.z,name:playerName,hp:localHp})})}async function pollState(){const r=await fetch(BASE+"/get_state");if(!r.ok)return;const arr=await r.json(),seen=new Set;for(const p of arr){if(!p||!p.id||p.id===PLAYER_ID)continue;seen.add(p.id);let e=rem.get(p.id);if(!e){const s=createSoldier(0x40c4ff);scene.add(s);e={s};rem.set(p.id,e)}e.s.position.set(p.x,p.y,p.z)}for(const[id,e]of rem.entries())if(!seen.has(id)){scene.remove(e.s);rem.delete(id)}}async function pollFeed(){const r=await fetch(BASE+"/feed");if(!r.ok)return;const f=await r.json();killfeedEl.innerHTML="";f.forEach(ev=>{const d=document.createElement("div");d.textContent=`${ev.attacker} → ${ev.target}`;killfeedEl.appendChild(d)})}function die(){isDead=true;localHp=0;lobby.style.display="flex"}function respawn(){isDead=false;localHp=100;player.position.set(0,.5,0);lobby.style.display="none";sendUpdate()}document.getElementById("play-btn").onclick=()=>{playerName=nameInput.value||"Player";respawn()};let last=performance.now();function loop(t){const dt=(t-last)/1e3;last=t;updateMovement(dt);animateSoldier(localSoldier,dt);renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);setInterval(sendUpdate,120);setInterval(pollState,200);setInterval(pollFeed,500);
</script></body></html>
