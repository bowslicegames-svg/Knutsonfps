<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KnutsonFPS – Tactical Glass UI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body,html {
        margin:0; padding:0; overflow:hidden;
        background:#0a0f14;
        font-family:Arial, sans-serif;
    }

    /* ============================
       TACTICAL GLASS UI STYLING
    ============================ */
    .glass {
        backdrop-filter: blur(10px);
        background: rgba(0, 40, 70, 0.35);
        border: 1px solid rgba(0,150,255,0.25);
        box-shadow: 0 0 12px rgba(0,150,255,0.25);
    }

    #killfeed {
        position:absolute; top:20px; right:20px;
        width:200px; padding:10px;
        color:#bfeaff; font-size:14px;
        text-align:right; pointer-events:none;
    }

    #crosshair {
        position:absolute; top:50%; left:50%;
        width:20px; height:20px;
        transform:translate(-50%, -50%);
        border:2px solid rgba(0,150,255,0.7);
        border-radius:50%;
        box-shadow:0 0 10px rgba(0,150,255,0.5);
    }

    /* Joystick */
    #joystickBase {
        position:absolute; bottom:40px; left:40px;
        width:140px; height:140px; border-radius:50%;
    }
    #joystickStick {
        position:absolute; width:70px; height:70px;
        border-radius:50%;
        top:35px; left:35px;
        background:rgba(0,150,255,0.4);
        border:2px solid rgba(0,150,255,0.8);
        box-shadow:0 0 12px rgba(0,150,255,0.5);
    }

    /* Fire button */
    #fireBtn {
        position:absolute; bottom:60px; right:40px;
        width:90px; height:90px; border-radius:50%;
        background:rgba(255,60,60,0.35);
        border:2px solid rgba(255,80,80,0.8);
        box-shadow:0 0 12px rgba(255,60,60,0.5);
    }

    /* Grenade button */
    #grenadeBtn {
        position:absolute; bottom:170px; right:40px;
        width:75px; height:75px; border-radius:50%;
        background:rgba(0,150,255,0.35);
        border:2px solid rgba(0,150,255,0.8);
        box-shadow:0 0 12px rgba(0,150,255,0.5);
    }
</style>
</head>
<body>

<div id="crosshair"></div>

<div id="killfeed" class="glass"></div>

<div id="joystickBase" class="glass">
    <div id="joystickStick"></div>
</div>

<button id="fireBtn" class="glass"></button>
<button id="grenadeBtn" class="glass"></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* ============================================================
   CONFIG
============================================================ */
const BASE = "https://YOUR-RAILWAY-URL.up.railway.app";  // <--- CHANGE THIS
const PLAYER_ID = "p_" + Math.random().toString(36).slice(2);
let health = 1;

/* ============================================================
   THREE.JS SETUP
============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0f14);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 1.6, 5);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(200,200),
    new THREE.MeshBasicMaterial({ color:0x111111 })
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/* ============================================================
   PLAYER + MOVEMENT
============================================================ */
const player = {
    obj: new THREE.Object3D(),
    speed: 0.08
};
scene.add(player.obj);

let moveX = 0, moveZ = 0;

function updateMovement() {
    player.obj.position.x += moveX * player.speed;
    player.obj.position.z += moveZ * player.speed;
}

/* ============================================================
   REMOTE PLAYERS
============================================================ */
const otherPlayers = new Map();

function spawnRemote(id) {
    const g = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.3,1.2,4,8),
        new THREE.MeshBasicMaterial({ color:0x00c8ff })
    );
    scene.add(g);
    otherPlayers.set(id, { obj:g });
}

function updateRemotePlayers(list) {
    const seen = new Set();

    list.forEach(p => {
        if (p.id === PLAYER_ID) return;
        seen.add(p.id);

        if (!otherPlayers.has(p.id)) spawnRemote(p.id);

        const entry = otherPlayers.get(p.id);
        entry.obj.position.set(p.x, p.y, p.z);
    });

    for (const id of otherPlayers.keys()) {
        if (!seen.has(id)) {
            scene.remove(otherPlayers.get(id).obj);
            otherPlayers.delete(id);
        }
    }
}

/* ============================================================
   SHOOTING
============================================================ */
function shoot() {
    const origin = camera.position.clone();
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);

    const ray = new THREE.Raycaster(origin, dir, 0, 50);
    const targets = [];
    const idByMesh = new Map();

    otherPlayers.forEach((entry, id) => {
        targets.push(entry.obj);
        idByMesh.set(entry.obj, id);
    });

    const hits = ray.intersectObjects(targets, true);
    if (hits.length === 0) return;

    const hitObj = hits[0].object;
    let targetId = null;

    idByMesh.forEach((id, obj) => {
        if (obj === hitObj) targetId = id;
    });

    if (!targetId) return;

    fetch(`${BASE}/damage`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            attacker: PLAYER_ID,
            target: targetId,
            amount: 12
        })
    });
}

/* ============================================================
   GRENADE
============================================================ */
class Grenade {
    constructor(pos) {
        this.mesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.15,16,16),
            new THREE.MeshBasicMaterial({ color:0x00aaff })
        );
        this.mesh.position.copy(pos);
        scene.add(this.mesh);

        this.vel = new THREE.Vector3(
            (Math.random()-0.5)*0.1,
            0.15,
            (Math.random()-0.5)*0.1
        );

        this.timer = 60;
    }

    update() {
        this.mesh.position.add(this.vel);
        this.vel.y -= 0.008;

        if (--this.timer <= 0) this.explode();
    }

    explode() {
        const pos = this.mesh.position.clone();
        scene.remove(this.mesh);

        otherPlayers.forEach((entry, id) => {
            const dist = entry.obj.position.distanceTo(pos);
            if (dist < 3) {
                const dmg = Math.round(45 * (1 - dist/3));
                fetch(`${BASE}/damage`, {
                    method:"POST",
                    headers:{ "Content-Type":"application/json" },
                    body:JSON.stringify({
                        attacker: PLAYER_ID,
                        target: id,
                        amount: dmg
                    })
                });
            }
        });

        this.dead = true;
    }
}

const grenades = [];

/* ============================================================
   NETWORK SYNC
============================================================ */
function sendState() {
    fetch(`${BASE}/update`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            id: PLAYER_ID,
            x: player.obj.position.x,
            y: player.obj.position.y,
            z: player.obj.position.z,
            name: "Player",
            hp: Math.round(health*100)
        })
    });
}

async function getState() {
    const res = await fetch(`${BASE}/get_state`);
    const list = await res.json();
    updateRemotePlayers(list);
}

/* ============================================================
   KILLFEED
============================================================ */
const killfeedEl = document.getElementById("killfeed");
let lastFeed = "";

async function pollFeed() {
    const res = await fetch(`${BASE}/feed`);
    const events = await res.json();
    const json = JSON.stringify(events);
    if (json === lastFeed) return;
    lastFeed = json;

    killfeedEl.innerHTML = "";
    events.forEach(ev => {
        const div = document.createElement("div");
        div.textContent = `${ev.attacker} ➜ ${ev.target}`;
        killfeedEl.appendChild(div);
    });
}

/* ============================================================
   JOYSTICK
============================================================ */
const base = document.getElementById("joystickBase");
const stick = document.getElementById("joystickStick");

let joyActive = false;
let startX = 0, startY = 0;

base.addEventListener("touchstart", e => {
    joyActive = true;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
});

document.addEventListener("touchmove", e => {
    if (!joyActive) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;

    moveX = dx / 120;
    moveZ = dy / 120;

    stick.style.transform = `translate(${dx/3}px, ${dy/3}px)`;
});

document.addEventListener("touchend", () => {
    joyActive = false;
    moveX = 0;
    moveZ = 0;
    stick.style.transform = "translate(0,0)";
});

/* ============================================================
   BUTTONS
============================================================ */
document.getElementById("fireBtn").onclick = shoot;

document.getElementById("grenadeBtn").onclick = () => {
    grenades.push(new Grenade(player.obj.position.clone()));
};

/* ============================================================
   MAIN LOOP
============================================================ */
function loop() {
    updateMovement();

    grenades.forEach(g => !g.dead && g.update());

    renderer.render(scene, camera);
    requestAnimationFrame(loop);
}
loop();

setInterval(sendState, 50);
setInterval(getState, 50);
setInterval(pollFeed, 1000);
</script>

</body>
</html>
