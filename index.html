<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>KnutsonFPS – Tactical Multiplayer</title><script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script><style>html, body {margin: 0;padding: 0;overflow: hidden;background: #050608;touch-action: none;-webkit-user-select: none;user-select: none;font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;}canvas {width: 100vw;height: 100vh;display: block;}/* Tactical HUD text /#info {position: absolute;top: 10px;left: 10px;z-index: 20;background: rgba(5, 10, 15, 0.85);padding: 6px 10px;border-radius: 4px;font-size: 11px;color: #cfd8dc;border: 1px solid rgba(0, 255, 128, 0.25);letter-spacing: 0.08em;text-transform: uppercase;}/ LOBBY /#lobby {position: absolute;inset: 0;background: radial-gradient(circle at top, #151b22 0, #050608 60%);display: flex;align-items: center;justify-content: center;z-index: 50;}#lobby-panel {width: 340px;padding: 20px 24px;background: rgba(3, 6, 10, 0.95);border-radius: 10px;color: #eceff1;box-shadow: 0 0 30px rgba(0,0,0,0.9);border: 1px solid rgba(0, 255, 128, 0.25);}#lobby-title {font-size: 22px;margin-bottom: 4px;text-align: center;letter-spacing: 0.18em;text-transform: uppercase;color: #e0f2f1;}#lobby-subtitle {font-size: 11px;text-align: center;text-transform: uppercase;letter-spacing: 0.16em;color: #78909c;margin-bottom: 14px;}.lobby-label {font-size: 12px;margin-top: 10px;margin-bottom: 4px;text-transform: uppercase;letter-spacing: 0.12em;color: #90a4ae;}.lobby-input, #name-input {width: 100%;padding: 6px 8px;border-radius: 4px;border: 1px solid #263238;background: #11171d;color: #eceff1;box-sizing: border-box;font-size: 13px;}.lobby-input:focus, #name-input:focus {outline: none;border-color: #00e676;}#color-row {display: flex;gap: 6px;margin-top: 4px;}.color-swatch {width: 26px;height: 26px;border-radius: 4px;border: 2px solid transparent;box-sizing: border-box;cursor: pointer;}.color-swatch.selected {border-color: #00e676;}#sens-value {float: right;font-size: 11px;opacity: 0.8;color: #cfd8dc;}#sens-slider {width: 100%;}#play-btn {margin-top: 16px;width: 100%;padding: 8px 0;border-radius: 4px;border: none;background: linear-gradient(90deg, #00c853, #64dd17);color: #000;font-size: 14px;font-weight: 600;text-transform: uppercase;letter-spacing: 0.16em;cursor: pointer;}#play-btn:active {transform: translateY(1px);filter: brightness(0.9);}/ Joystick /.joystick {position: absolute;width: 140px;height: 140px;border-radius: 50%;background: rgba(10, 20, 25, 0.7);border: 1px solid rgba(0, 255, 128, 0.25);z-index: 10;}#joy-move { bottom: 40px; left: 40px; }.stick {position: absolute;width: 60px;height: 60px;left: 40px;top: 40px;border-radius: 50%;background: radial-gradient(circle, #00e676 0, #004d40 70%);box-shadow: 0 0 10px rgba(0, 230, 118, 0.6);}/ Buttons /#jump-btn, #sprint-btn, #shoot-btn, #grenade-btn {position: absolute;bottom: 70px;width: 70px;height: 70px;border-radius: 50%;background: rgba(10, 20, 25, 0.8);border: 1px solid rgba(0, 255, 128, 0.4);color: #e0f2f1;font-size: 20px;display: flex;align-items: center;justify-content: center;touch-action: none;z-index: 10;}#jump-btn { right: 200px; }#sprint-btn {right: 290px;border-color: rgba(0, 230, 118, 0.8);color: #00e676;}#shoot-btn {right: 110px;border-color: rgba(255, 82, 82, 0.9);color: #ff5252;}#grenade-btn {right: 30px;border-color: rgba(255, 165, 0, 0.9);color: #ffa500;font-weight: 700;}/ Stamina + health /#stamina-container, #health-container {position: absolute;height: 16px;border-radius: 2px;background: rgba(5, 10, 15, 0.9);z-index: 10;border: 1px solid rgba(0, 255, 128, 0.25);}#stamina-container {bottom: 150px;right: 40px;width: 200px;}#health-container {top: 10px;right: 40px;width: 200px;}#stamina-bar, #health-bar {width: 100%;height: 100%;}#stamina-bar {background: linear-gradient(90deg, #00e676, #aeea00);}#health-bar {background: linear-gradient(90deg, #ff1744, #ff9100);}/ Crosshair /#crosshair {position: absolute;left: 50%;top: 50%;width: 14px;height: 14px;margin-left: -7px;margin-top: -7px;border-radius: 50%;border: 2px solid #cfd8dc;box-shadow: 0 0 8px rgba(0,0,0,0.9);z-index: 10;}/ Hit marker /#hitmarker {position: absolute;left: 50%;top: 50%;width: 22px;height: 22px;margin-left: -11px;margin-top: -11px;border-radius: 50%;border: 2px solid #ffeb3b;opacity: 0;transform: scale(0.5);transition: opacity 0.08s, transform 0.08s;z-index: 11;}/ View toggle /#view-toggle {position: absolute;top: 10px;right: 260px;padding: 4px 8px;border-radius: 4px;background: rgba(5, 10, 15, 0.9);color: #cfd8dc;font-size: 11px;z-index: 10;border: 1px solid rgba(0, 255, 128, 0.25);text-transform: uppercase;letter-spacing: 0.12em;}/ Name labels /.name-label {position: absolute;font-size: 11px;color: #eceff1;text-shadow: 0 0 4px black;pointer-events: none;z-index: 9;text-transform: uppercase;letter-spacing: 0.12em;}</style></head><body><!-- LOBBY --><div id="lobby"><div id="lobby-panel"><div id="lobby-title">KNUTSONFPS</div><div id="lobby-subtitle">TACTICAL MOBILE ARENA</div><div class="lobby-label">Operator ID</div><input id="name-input" class="lobby-input" maxlength="16" value="KnutsonFPS" /><div class="lobby-label">Squad Colour</div><div id="color-row"><div class="color-swatch" data-color="0xff5252" style="background:#ff5252"></div><div class="color-swatch selected" data-color="0x40c4ff" style="background:#40c4ff"></div><div class="color-swatch" data-color="0x69f0ae" style="background:#69f0ae"></div><div class="color-swatch" data-color="0xffeb3b" style="background:#ffeb3b"></div><div class="color-swatch" data-color="0xff80ab" style="background:#ff80ab"></div></div><div class="lobby-label">Look sensitivity<span id="sens-value">1.0</span></div><input id="sens-slider" type="range" min="0.5" max="2.0" step="0.1" value="1.0" /><button id="play-btn">DEPLOY</button></div></div><div id="info">KNUTSONFPS // DRAG RIGHT TO AIM // LEFT STICK TO MOVE</div><div id="crosshair"></div><div id="hitmarker"></div><div id="joy-move" class="joystick"><div id="stick-move" class="stick"></div></div><div id="jump-btn">⤴</div><div id="sprint-btn">SPR</div><div id="shoot-btn">FIRE</div><div id="grenade-btn">GRN</div><div id="stamina-container"><div id="stamina-bar"></div></div><div id="health-container"><div id="health-bar"></div></div><div id="view-toggle">VIEW: 1ST</div><canvas id="game"></canvas><script>/ -------------------------LOBBY STATE--------------------------/let playerName = "KnutsonFPS";let playerColor = 0x40c4ff;let lookSensitivity = 1.0;const lobby = document.getElementById("lobby");const nameInput = document.getElementById("name-input");const sensSlider = document.getElementById("sens-slider");const sensValue = document.getElementById("sens-value");sensSlider.addEventListener("input", () => {sensValue.textContent = sensSlider.value;});const colorSwatches = Array.from(document.querySelectorAll(".color-swatch"));colorSwatches[1].classList.add("selected");colorSwatches.forEach(s => {s.addEventListener("click", () => {colorSwatches.forEach(x => x.classList.remove("selected"));s.classList.add("selected");playerColor = parseInt(s.dataset.color);});});document.getElementById("play-btn").addEventListener("click", () => {playerName = (nameInput.value.trim() || "KnutsonFPS");lookSensitivity = parseFloat(sensSlider.value);lobby.style.display = "none";});/ -------------------------PLAYER ID--------------------------/const PLAYER_ID = "p_" + Math.random().toString(36).slice(2);/ -------------------------THREE SETUP--------------------------/const canvas = document.getElementById("game");const renderer = new THREE.WebGLRenderer({ canvas });renderer.setSize(window.innerWidth, window.innerHeight);const scene = new THREE.Scene();scene.background = new THREE.Color(0x101318);const camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,1000);scene.add(new THREE.AmbientLight(0x404040));const light = new THREE.DirectionalLight(0xffffff, 1);light.position.set(5, 10, 7);scene.add(light);const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600),new THREE.MeshPhongMaterial({ color: 0x263238 }));ground.rotation.x = -Math.PI / 2;scene.add(ground);/ Simple tactical walls /function addWall(x, z, w, h, rot) {const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 3, h),new THREE.MeshPhongMaterial({ color: 0x37474f }));wall.position.set(x, 1.5, z);wall.rotation.y = rot || 0;scene.add(wall);}addWall(0, -100, 200, 1, 0);addWall(0, 100, 200, 1, 0);addWall(-100, 0, 1, 200, 0);addWall(100, 0, 1, 200, 0);addWall(0, 0, 60, 1, Math.PI / 4);/ -------------------------LOCAL PLAYER--------------------------/const player = new THREE.Object3D();player.position.set(0, 0.5, 0);scene.add(player);function createCapsule(color) {const group = new THREE.Group();const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.2, 16),new THREE.MeshPhongMaterial({ color }));body.position.y = 0.6;const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16),new THREE.MeshPhongMaterial({ color }));head.position.y = 1.4;group.add(body);group.add(head);return group;}const localCapsule = createCapsule(playerColor);player.add(localCapsule);/ -------------------------CAMERA ROTATION--------------------------/let yaw = 0;let pitch = 0;const pitchLimit = THREE.MathUtils.degToRad(40);/ -------------------------GRAVITY / JUMP--------------------------/let velY = 0;const gravity = -20;const jumpSpeed = 8;let grounded = true;/ -------------------------SPRINT / STAMINA / HEALTH--------------------------/let sprinting = false;let stamina = 1;const staminaDrain = 0.5;const staminaRegen = 0.3;const staminaBar = document.getElementById("stamina-bar");let health = 1;const healthBar = document.getElementById("health-bar");/ -------------------------VIEW MODE--------------------------/let thirdPerson = false;const viewToggle = document.getElementById("view-toggle");viewToggle.addEventListener("click", () => {thirdPerson = !thirdPerson;viewToggle.textContent = "VIEW: " + (thirdPerson ? "3RD" : "1ST");});/ -------------------------OTHER PLAYERS--------------------------/const otherPlayers = new Map(); // id -> {obj, label, name}function randomColor() {const colors = [0xff5252, 0x40c4ff, 0x69f0ae, 0xffeb3b, 0xff80ab];return colors[Math.floor(Math.random() * colors.length)];}/ Name labels /function createNameLabel(text) {const el = document.createElement("div");el.className = "name-label";el.textContent = text;document.body.appendChild(el);return el;}/ -------------------------MOVEMENT JOYSTICK--------------------------/function createJoystick(joyEl, stickEl, callback) {const max = 50;const center = 70;let fingerId = null;joyEl.addEventListener("touchstart", e => {if (fingerId === null) fingerId = e.changedTouches[0].identifier;});joyEl.addEventListener("touchmove", e => {for (const t of e.changedTouches) {if (t.identifier === fingerId) {const rect = joyEl.getBoundingClientRect();let x = t.clientX - rect.left - center;let y = t.clientY - rect.top - center;const dist = Math.hypot(x, y);if (dist > max) {x = (x / dist) * max;y = (y / dist) * max;}stickEl.style.left = (x + 40) + "px";stickEl.style.top = (y + 40) + "px";callback(x / max, y / max);}}});joyEl.addEventListener("touchend", e => {for (const t of e.changedTouches) {if (t.identifier === fingerId) {fingerId = null;stickEl.style.left = "40px";stickEl.style.top = "40px";callback(0, 0);}}});}let moveX = 0, moveY = 0;createJoystick(document.getElementById("joy-move"),document.getElementById("stick-move"),(x, y) => { moveX = x; moveY = y; });/ -------------------------POXEL-STYLE LOOK: DRAG RIGHT SIDE--------------------------/let lookFinger = null;let lastLX = 0, lastLY = 0;window.addEventListener("touchstart", e => {for (const t of e.changedTouches) {if (t.clientX > window.innerWidth * 0.5 && lookFinger === null) {lookFinger = t.identifier;lastLX = t.clientX;lastLY = t.clientY;}}});window.addEventListener("touchmove", e => {for (const t of e.changedTouches) {if (t.identifier === lookFinger) {const dx = t.clientX - lastLX;const dy = t.clientY - lastLY;const baseSens = 0.0045;const sensitivity = baseSens * lookSensitivity;yaw += dx * sensitivity;pitch -= dy * sensitivity;pitch = Math.max(-pitchLimit, Math.min(pitchLimit, pitch));lastLX = t.clientX;lastLY = t.clientY;}}});window.addEventListener("touchend", e => {for (const t of e.changedTouches) {if (t.identifier === lookFinger) {lookFinger = null;}}});/ -------------------------JUMP / SPRINT BUTTONS--------------------------/document.getElementById("jump-btn").addEventListener("touchstart", e => {if (grounded) {velY = jumpSpeed;grounded = false;}e.preventDefault();});document.getElementById("sprint-btn").addEventListener("touchstart", e => {sprinting = true;e.preventDefault();});document.getElementById("sprint-btn").addEventListener("touchend", e => {sprinting = false;e.preventDefault();});/ -------------------------SHOOTING / HITMARKER--------------------------/const shootBtn = document.getElementById("shoot-btn");const hitmarker = document.getElementById("hitmarker");let shootCooldown = 0;function showHitmarker() {hitmarker.style.opacity = "1";hitmarker.style.transform = "scale(1)";setTimeout(() => {hitmarker.style.opacity = "0";hitmarker.style.transform = "scale(0.5)";}, 120);}shootBtn.addEventListener("touchstart", e => {if (shootCooldown <= 0) {shoot();shootCooldown = 0.25;}e.preventDefault();});function shoot() {const origin = camera.position.clone();const dir = new THREE.Vector3();camera.getWorldDirection(dir);const ray = new THREE.Raycaster(origin, dir, 0, 50);const targets = [];otherPlayers.forEach(p => targets.push(p.obj));const hits = ray.intersectObjects(targets, true);if (hits.length > 0) {showHitmarker();// Local-only feedback for now}}/ -------------------------MOVEMENT + CAMERA--------------------------/function updateMovement(dt) {const baseSpeed = 7;const sprintMult = 1.8;// Hard deadzoneconst deadzone = 0.35;let mx = Math.abs(moveX) > deadzone ? moveX : 0;let my = Math.abs(moveY) > deadzone ? moveY : 0;// Sprint / staminalet speed = baseSpeed;if (sprinting && stamina > 0.05) {speed = sprintMult;stamina -= staminaDrain * dt;} else {stamina += staminaRegen * dt;}stamina = Math.max(0, Math.min(1, stamina));staminaBar.style.width = (stamina * 100) + "%";// Movement relative to yawconst forward = -my;const strafe = mx;const cosY = Math.cos(yaw);const sinY = Math.sin(yaw);const dx = (strafe * cosY) + (forward * sinY);const dz = (strafe * sinY) - (forward * cosY);player.position.x += dx * speed * dt;player.position.z += dz * speed * dt;// GravityvelY += gravity * dt;player.position.y += velY * dt;if (player.position.y < 0.5) {player.position.y = 0.5;velY = 0;grounded = true;}// Cameraconst camHeight = 1.4;if (!thirdPerson) {camera.position.set(player.position.x,player.position.y + camHeight - 0.5,player.position.z);} else {const dist = 3;const offsetX = Math.sin(yaw) * -dist;const offsetZ = -Math.cos(yaw) * -dist;camera.position.set(player.position.x + offsetX,player.position.y + camHeight + 1,player.position.z + offsetZ);}const dir = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw) * Math.cos(pitch));camera.lookAt(camera.position.x + dir.x,camera.position.y + dir.y,camera.position.z + dir.z);}/ -------------------------HEALTH / RESPAWN--------------------------/function applyDamage(amount) {health -= amount;if (health <= 0) {health = 0;respawn();}healthBar.style.width = (health * 100) + "%";}function respawn() {player.position.set(0, 0.5, 0);velY = 0;health = 1;healthBar.style.width = "100%";}/* -------------------------NETWORKING (POSITION ONLY)--------------------------/async function sendState() {const body = new URLSearchParams();body.append("id", PLAYER_ID);body.append("x", player.position.x);body.append("y", player.position.y);body.append("z", player.position.z);body.append("name", playerName);await fetch("https://knutsonfps.infinityfreeapp.com/update.php", {method: "POST",headers: {"Content-Type": "application/x-www-form-urlencoded"},body});}async function getState() {const res = await fetch("https://knutsonfps.infinityfreeapp.com/get_state.php");const players = await res.json();updateOtherPlayers(players);}function updateOtherPlayers(list) {const seen = new Set();list.forEach(p => {if (p.id === PLAYER_ID) return;seen.add(p.id);let entry = otherPlayers.get(p.id);if (!entry) {const obj = createCapsule(randomColor());scene.add(obj);const label = createNameLabel(p.name || "Player");entry = { obj, label, name: p.name || "Player", targetPos: new THREE.Vector3(parseFloat(p.x), 0.5, parseFloat(p.z)) };otherPlayers.set(p.id, entry);} else {entry.targetPos.set(parseFloat(p.x), 0.5, parseFloat(p.z));if (p.name && p.name !== entry.name) {entry.name = p.name;entry.label.textContent = p.name;}}});for (const [id, entry] of otherPlayers.entries()) {if (!seen.has(id)) {scene.remove(entry.obj);entry.label.remove();otherPlayers.delete(id);}}}// Smoothly interpolate other players positionsfunction updateNameLabels() {const width = window.innerWidth;const height = window.innerHeight;otherPlayers.forEach(entry => {// Smooth position interpolationentry.obj.position.lerp(entry.targetPos, 0.1);const pos = entry.obj.position.clone();pos.y += 2.0;pos.project(camera);const x = (pos.x * 0.5 + 0.5) * width;const y = (-pos.y * 0.5 + 0.5) * height;entry.label.style.left = x + "px";entry.label.style.top = y + "px";});}/ -------------------------  ADDED GRENADE WITH IMPACT FUSE AND SEPARATE BUTTON  --------------------------/class Grenade {constructor(position, direction) {this.mesh = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12),new THREE.MeshPhongMaterial({ color: 0x888888 }));this.mesh.position.copy(position);this.velocity = direction.clone().multiplyScalar(10);this.gravity = new THREE.Vector3(0, -30, 0);this.alive = true;this.timer = 5.0; // seconds before explosionthis.exploded = false;scene.add(this.mesh);}update(dt) {if (!this.alive) return;this.velocity.add(this.gravity.clone().multiplyScalar(dt));this.mesh.position.add(this.velocity.clone().multiplyScalar(dt));this.timer -= dt; // Check for impact fuse: explode on ground contact or timer expiryif (this.mesh.position.y <= 0.2 && !this.exploded) {this.explode();} else if (this.timer <= 0 && !this.exploded) {this.explode();}}explode() {this.exploded = true;this.alive = false;scene.remove(this.mesh); // TODO: Add explosion effect and damage logicconsole.log("Grenade exploded at", this.mesh.position);}}const grenades = [];function throwGrenade() {const origin = player.position.clone();origin.y += 1.2;const dir = new THREE.Vector3();camera.getWorldDirection(dir);const grenade = new Grenade(origin, dir);grenades.push(grenade);}const grenadeBtn = document.getElementById("grenade-btn");grenadeBtn.addEventListener("touchstart", e => {throwGrenade();e.preventDefault();});/ -------------------------  UPDATE LOOP MODIFIED TO INCLUDE GRENADE UPDATES  --------------------------*/let last = performance.now();setInterval(sendState, 20);setInterval(getState, 20);function loop(now) {const dt = (now - last) / 1000;last = now;if (shootCooldown > 0) shootCooldown -= dt;updateMovement(dt);updateNameLabels();grenades.forEach(g => g.update(dt));// Remove exploded grenadesfor (let i = grenades.length - 1; i >= 0; i--) {if (!grenades[i].alive) grenades.splice(i, 1);}renderer.render(scene, camera);}renderer.setAnimationLoop(loop);</script></body></html>
