<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KnutsonFPS Multiplayer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ======================================================
//  THREE.JS SETUP
// ======================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202020);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Player model (simple cube for now)
const playerGeometry = new THREE.BoxGeometry(1, 2, 1);
const playerMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
const player = new THREE.Mesh(playerGeometry, playerMaterial);
scene.add(player);

player.position.set(0, 1, 0);

// Ground
const groundGeo = new THREE.PlaneGeometry(500, 500);
const groundMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Camera offset
const cameraOffset = new THREE.Vector3(0, 5, -10);

// ======================================================
//  INPUT HANDLING
// ======================================================
const keys = {};
document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

function updatePlayerMovement(delta) {
  const speed = 10 * delta;

  if (keys["KeyW"]) player.position.z -= speed;
  if (keys["KeyS"]) player.position.z += speed;
  if (keys["KeyA"]) player.position.x -= speed;
  if (keys["KeyD"]) player.position.x += speed;

  // Rotate with Q/E
  if (keys["KeyQ"]) player.rotation.y += 2 * delta;
  if (keys["KeyE"]) player.rotation.y -= 2 * delta;
}

// ======================================================
//  WEBSOCKET SETUP
// ======================================================
let ws;
let playerId = null;

function connectWS() {
  ws = new WebSocket("wss://knutsonfps-backend.onrender.com");

  ws.onopen = () => {
    console.log("Connected to backend");
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === "welcome") {
      playerId = msg.id;
      console.log("Assigned player ID:", playerId);
    }
  };

  ws.onclose = () => {
    console.log("Disconnected. Reconnecting...");
    setTimeout(connectWS, 1000);
  };
}

connectWS();

// Send player updates 10× per second
setInterval(() => {
  if (!ws || ws.readyState !== WebSocket.OPEN || !playerId) return;

  ws.send(JSON.stringify({
    type: "update",
    x: player.position.x,
    y: player.position.y,
    z: player.position.z,
    rot: player.rotation.y
  }));
}, 100);

// ======================================================
//  REMOTE PLAYERS
// ======================================================
const remotePlayers = {};

function updateRemotePlayer(id, x, y, z, rot) {
  let obj = remotePlayers[id];

  if (!obj) {
    const geo = new THREE.BoxGeometry(1, 2, 1);
    const mat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    obj = new THREE.Mesh(geo, mat);
    scene.add(obj);
    remotePlayers[id] = obj;
  }

  obj.position.set(x, y, z);
  obj.rotation.y = rot;
}

// Poll backend for all players
async function pollPlayers() {
  try {
    const res = await fetch("https://knutsonfps-backend.onrender.com/debug/state");
    const data = await res.json();

    for (const id in data.players) {
      if (id === playerId) continue;
      const p = data.players[id];
      updateRemotePlayer(id, p.x, p.y, p.z, p.rot);
    }
  } catch (err) {
    console.log("poll error", err);
  }
}

setInterval(pollPlayers, 200);

// ======================================================
//  GAME LOOP
// ======================================================
let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const delta = (now - lastTime) / 1000;
  lastTime = now;

  updatePlayerMovement(delta);

  // Camera follow
  const camPos = player.position.clone().add(cameraOffset.clone().applyAxisAngle(new THREE.Vector3(0,1,0), player.rotation.y));
  camera.position.lerp(camPos, 0.1);
  camera.lookAt(player.position);

  renderer.render(scene, camera);
}

animate();

// Resize
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
