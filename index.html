<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KnutsonFPS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}
#gameCanvas {
  width: 100vw;
  height: 100vh;
  display: block;
  background: #111;
}
#ui {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  pointer-events: none;
}
#menu {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(20,20,20,0.9);
  padding: 20px;
  border-radius: 10px;
  pointer-events: auto;
  text-align: center;
}
#menu input {
  width: 200px;
  padding: 8px;
  margin-bottom: 10px;
}
#menu button {
  padding: 10px 20px;
  margin-top: 10px;
}
#crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 10px;
  height: 10px;
  margin-left: -5px;
  margin-top: -5px;
  border: 2px solid white;
  border-radius: 50%;
  display: none;
}
#hpBar {
  position: absolute;
  left: 20px;
  bottom: 20px;
  width: 200px;
  height: 20px;
  border: 2px solid white;
  display: none;
}
#hpFill {
  width: 100%;
  height: 100%;
  background: lime;
}
#killfeed {
  position: absolute;
  right: 20px;
  top: 20px;
  text-align: right;
  font-size: 14px;
}
#deathScreen {
  position: absolute;
  inset: 0;
  background: rgba(100,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  pointer-events: auto;
}
#deathScreen button {
  padding: 10px 20px;
  margin-top: 10px;
}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui">

  <div id="menu">
    <h2>KnutsonFPS</h2>
    <input id="nameInput" placeholder="Name">
    <br>
    <button id="playBtn">Play</button>
  </div>

  <div id="crosshair"></div>

  <div id="hpBar"><div id="hpFill"></div></div>

  <div id="killfeed"></div>

  <div id="deathScreen">
    <h1>You Died</h1>
    <button id="respawnBtn">Respawn</button>
    <button id="menuBtn">Back to Menu</button>
  </div>

</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<script>
// ---------------- CONFIG ----------------
const BASE = "https://knutsonfps-backend.knutsonfps.deno.net";

// ---------------- DOM ----------------
const canvas = document.getElementById("gameCanvas");
const menu = document.getElementById("menu");
const playBtn = document.getElementById("playBtn");
const nameInput = document.getElementById("nameInput");
const crosshair = document.getElementById("crosshair");
const hpBar = document.getElementById("hpBar");
const hpFill = document.getElementById("hpFill");
const killfeedDiv = document.getElementById("killfeed");
const deathScreen = document.getElementById("deathScreen");
const respawnBtn = document.getElementById("respawnBtn");
const menuBtn = document.getElementById("menuBtn");

// ---------------- STATE ----------------
let playerId = localStorage.getItem("player_id") || ("p_" + Math.random().toString(36).slice(2));
localStorage.setItem("player_id", playerId);

let playerName = "Player";
let hp = 100;
let isDead = false;

let scene, camera, renderer;
let playerObj;
let yaw = 0, pitch = 0;
let keys = {};
let lastTime = performance.now();
let others = new Map();

let pollInterval = null;
let feedInterval = null;

// ---------------- THREE SETUP ----------------
function initThree() {
  renderer = new THREE.WebGLRenderer({ canvas });
  renderer.setSize(window.innerWidth, window.innerHeight);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 500);
  camera.position.set(0, 1.6, 5);

  const amb = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(amb);

  const dir = new THREE.DirectionalLight(0xffffff, 0.6);
  dir.position.set(5,10,2);
  scene.add(dir);

  const floorGeo = new THREE.PlaneGeometry(200,200);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  scene.add(floor);

  playerObj = new THREE.Object3D();
  scene.add(playerObj);

  const bodyGeo = new THREE.CapsuleGeometry(0.4,1.0,4,8);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 1;
  body.rotation.y = -Math.PI/2;
  playerObj.add(body);

  window.addEventListener("resize", () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
  });

  window.addEventListener("keydown", e => keys[e.code] = true);
  window.addEventListener("keyup", e => keys[e.code] = false);

  canvas.addEventListener("click", () => {
    canvas.requestPointerLock();
  });

  document.addEventListener("pointerlockchange", () => {
    if (document.pointerLockElement === canvas) {
      document.addEventListener("mousemove", onMouseMove);
    } else {
      document.removeEventListener("mousemove", onMouseMove);
    }
  });

  window.addEventListener("mousedown", e => {
    if (e.button === 0 && !isDead) shoot();
  });

  animate();
}

function onMouseMove(e) {
  const sens = 0.0025;
  yaw -= e.movementX * sens;
  pitch -= e.movementY * sens;
  pitch = Math.max(-1.4, Math.min(1.4, pitch));
}

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = (now - lastTime)/1000;
  lastTime = now;

  updatePlayer(dt);
  renderer.render(scene, camera);
}

function updatePlayer(dt) {
  if (isDead) return;

  playerObj.rotation.y = yaw;
  camera.rotation.set(pitch, yaw, 0);

  const speed = 8;
  let dir = new THREE.Vector3();
  if (keys["KeyW"]) dir.z -= 1;
  if (keys["KeyS"]) dir.z += 1;
  if (keys["KeyA"]) dir.x -= 1;
  if (keys["KeyD"]) dir.x += 1;

  if (dir.lengthSq() > 0) {
    dir.normalize();
    const forward = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
    const right = new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
    const move = new THREE.Vector3();
    move.addScaledVector(forward, dir.z);
    move.addScaledVector(right, dir.x);
    move.normalize().multiplyScalar(speed * dt);
    playerObj.position.add(move);
  }

  camera.position.copy(playerObj.position).add(new THREE.Vector3(0,1.6,0));
}

// ---------------- NETWORK ----------------
async function api(path, body) {
  try {
    const res = await fetch(BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    });
    return await res.json();
  } catch {
    return null;
  }
}

async function updateState() {
  const pos = playerObj.position;
  const res = await api("/update", {
    id: playerId,
    x: pos.x,
    y: pos.y,
    z: pos.z,
    name: playerName,
    hp
  });
  if (res && res.name) playerName = res.name;
}

async function pollState() {
  const res = await api("/get_state", {});
  if (!res) return;

  const seen = new Set();

  for (const p of res) {
    if (p.id === playerId) {
      hp = p.hp;
      updateHp();
      continue;
    }

    seen.add(p.id);

    let entry = others.get(p.id);
    if (!entry) {
      const geo = new THREE.CapsuleGeometry(0.4,1.0,4,8);
      const mat = new THREE.MeshStandardMaterial({ color: 0xf97316 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = 1;
      mesh.rotation.y = -Math.PI/2;

      const container = new THREE.Object3D();
      container.add(mesh);
      scene.add(container);

      entry = { obj: container, data: p };
      others.set(p.id, entry);
    }

    entry.obj.position.set(p.x,0,p.z);
    entry.data = p;
  }

  for (const [id, entry] of others) {
    if (!seen.has(id)) {
      scene.remove(entry.obj);
      others.delete(id);
    }
  }
}

async function pollFeed() {
  const res = await api("/feed", {});
  if (!res) return;
  killfeedDiv.innerHTML = "";
  for (const ev of res) {
    const div = document.createElement("div");
    div.textContent = `${ev.attacker} → ${ev.target}`;
    killfeedDiv.appendChild(div);
  }
}

async function shoot() {
  const origin = camera.position.clone();
  const dir = new THREE.Vector3(0,0,-1).applyEuler(camera.rotation).normalize();

  let closest = null;
  let closestDist = Infinity;

  for (const [id, entry] of others) {
    const target = entry.obj.position.clone().add(new THREE.Vector3(0,1,0));
    const to = target.clone().sub(origin);
    const proj = to.dot(dir);
    if (proj < 0) continue;

    const closestPoint = origin.clone().add(dir.clone().multiplyScalar(proj));
    const dist = closestPoint.distanceTo(target);

    if (dist < 1.0 && proj < closestDist) {
      closestDist = proj;
      closest = id;
    }
  }

  if (closest) {
    await api("/damage", {
      attacker: playerId,
      target: closest,
      amount: 34
    });
  }
}

// ---------------- UI ----------------
function updateHp() {
  hpFill.style.width = hp + "%";
  if (hp <= 0 && !isDead) die();
}

function die() {
  isDead = true;
  deathScreen.style.display = "flex";
  crosshair.style.display = "none";
  hpBar.style.display = "none";
}

function respawn() {
  isDead = false;
  hp = 100;
  updateHp();
  playerObj.position.set(
    (Math.random()-0.5)*20,
    0,
    (Math.random()-0.5)*20
  );
  deathScreen.style.display = "none";
  crosshair.style.display = "block";
  hpBar.style.display = "block";
}

// ---------------- FLOW ----------------
playBtn.onclick = () => {
  playerName = nameInput.value.trim() || "Player";
  menu.style.display = "none";
  crosshair.style.display = "block";
  hpBar.style.display = "block";

  pollInterval = setInterval(() => {
    updateState();
    pollState();
  }, 150);

  feedInterval = setInterval(() => {
    pollFeed();
  }, 800);
};

respawnBtn.onclick = respawn;

menuBtn.onclick = () => {
  clearInterval(pollInterval);
  clearInterval(feedInterval);
  pollInterval = null;
  feedInterval = null;

  others.forEach(o => scene.remove(o.obj));
  others.clear();

  deathScreen.style.display = "none";
  crosshair.style.display = "none";
  hpBar.style.display = "none";
  menu.style.display = "block";
};

// ---------------- START ----------------
initThree();
updateHp();
</script>

</body>
</html>
